# Pings the site's secured reminders endpoint every 30 minutes so guests get a
# "see you soon" email 1–2 hours before their table. (Vercel Hobby only allows
# one DAILY cron, so GitHub Actions provides the faster clock. Every reminder is
# sent at most once per booking — the endpoint tracks that.)
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   CRON_SECRET — must equal the CRON_SECRET env var on the Vercel project
#   SITE_URL    — e.g. https://www.dacecotfood.com
name: booking-reminders
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger reminder pass
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets not set — skipping." ; exit 0
          fi
          curl -fsS -X POST "$SITE_URL/api/cron/reminders" -H "x-cron-secret: $CRON_SECRET" | head -c 500
